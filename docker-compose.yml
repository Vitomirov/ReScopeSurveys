# Rescope Surveys — full stack (Postgres + API + web UI).
#
# Partner / fast start (pull pre-built images from Docker Hub):
#   docker compose pull && docker compose up -d
# 
#   open http://localhost:8080
#   login: admin / admin123  (vendor / vendor123 for platform console)
#
# No .env required for a local demo — defaults below are partner-safe only.
# Production VPS: use docker-compose.prod.yml (see docs/DEPLOY.md) and set
# strong JWT_SECRET + POSTGRES_PASSWORD in .env — seed accounts are disabled there.
#
# Developer (rebuild locally):
#   docker compose up --build -d
#
# Developer (live reload — no rebuild):
#   npm run dev:docker
#   open http://localhost:5173
#
# Publish images to Docker Hub (after `docker login`):
#   ./scripts/deploy/publish-docker.sh
#
# Database only (local npm dev with `npm run dev:all`):
#   npm run db:up
#   # or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up postgres -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescopesurveys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescopesurveys}
      POSTGRES_DB: ${POSTGRES_DB:-rescopesurveys}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host port is only needed for local npm dev (`docker compose -f docker-compose.yml -f docker-compose.dev.yml up postgres -d`).
    # Full stack / partner pull does not expose Postgres on the host.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rescopesurveys -d rescopesurveys']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKERHUB_USER:-vitomirov}/rescopesurveys-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rescopesurveys}:${POSTGRES_PASSWORD:-rescopesurveys}@postgres:5432/${POSTGRES_DB:-rescopesurveys}
      PORT: 3003
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-partner-docker-local-only-not-for-production-use-32ch}
      ACCESS_TOKEN_EXPIRES_IN: '15m'
      REFRESH_TOKEN_EXPIRES_IN: '30d'
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_ALLOW_BEARER: ${AUTH_ALLOW_BEARER:-true}
      # This stack is opened at http://localhost:8080. .env CORS_ORIGIN is the Vite
      # dev server (5173) and must not be the only origin allowed here.
      CORS_ORIGIN: http://localhost:8080,${CORS_ORIGIN:-http://localhost:5173}
      # Partner demo: account emails (invites, resets) are printed to `docker compose logs api`.
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      APP_URL: http://localhost:8080
      PANEL_OAUTH_CLIENT_ID: ${PANEL_OAUTH_CLIENT_ID:-rescope-panel-local}
      PANEL_OAUTH_CLIENT_SECRET: ${PANEL_OAUTH_CLIENT_SECRET:-panel-local-oauth-secret-not-for-production-use}
      PANEL_OAUTH_REDIRECT_URI: ${PANEL_OAUTH_REDIRECT_URI:-http://localhost:3010/api/auth/builder/callback}
      SEED_DEFAULT_ACCOUNTS: ${SEED_DEFAULT_ACCOUNTS:-true}
      RUN_PLATFORM_LIST_MIGRATION: ${RUN_PLATFORM_LIST_MIGRATION:-true}
      REQUIRE_STRONG_JWT: ${REQUIRE_STRONG_JWT:-false}
      RATE_LIMIT_RELAXED: ${RATE_LIMIT_RELAXED:-true}
    expose:
      - '3003'

  web:
    image: ${DOCKERHUB_USER:-vitomirov}/rescopesurveys-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_API: 'true'
        VITE_PANEL_URL: ${VITE_PANEL_URL:-http://localhost:3010}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_HOST_PORT:-8080}:80'

volumes:
  pgdata:
