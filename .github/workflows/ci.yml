name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Registry parity check
        run: npm run check:registries

      - name: Unit tests
        run: |
          npm run test:track-a
          npm run test:config
          npm run test:brand0
          node --test scripts/tests/unit/domain-verification-dns.test.mjs

      - name: Validate Compose configs
        run: |
          docker compose config > /dev/null
          JWT_SECRET=ci-test-secret-minimum-32-characters-long \
          POSTGRES_PASSWORD=ci-test-postgres-password \
          INTERNAL_API_SECRET=ci-test-internal-api-secret \
          SMTP_URL=smtps://ci:ci@smtp.example.com:465 \
          PANEL_OAUTH_CLIENT_SECRET=ci-test-panel-oauth-secret \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null

      - name: Build API image
        run: docker build -f server/Dockerfile -t rescopesurveys-api:ci .

      - name: Build web image
        run: docker build --build-arg VITE_USE_API=true --build-arg VITE_PANEL_URL=https://panel.rescopesurveys.com -t rescopesurveys-web:ci .
