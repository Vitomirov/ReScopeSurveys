# Production override — publish the web container on loopback only.
#
# On the VPS, HTTPS and domain routing are handled by Caddy running on the host
# (docker/caddy/Caddyfile), which proxies to 127.0.0.1:8080. Port 8080 itself
# must never be reachable from the internet. Docker publishes ports through its
# own iptables chain, which ufw rules do not filter, so binding to 127.0.0.1 is
# the control that actually closes the port.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   # or simply: ./scripts/deploy/deploy.sh  (picks this file up automatically)
#
# `!override` replaces the base `ports` list instead of appending to it
# (requires Docker Compose v2.24+; older versions concatenate and would keep
# publishing 0.0.0.0:8080). On older Compose, delete this file and set
# WEB_HOST_PORT=127.0.0.1:8080 in .env instead.
#
# Keep WEB_HOST_PORT a bare port number (e.g. 8080) when using this file.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong random value}
    mem_limit: ${POSTGRES_MEMORY:-512m}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rescopesurveys}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong random value}@postgres:5432/${POSTGRES_DB:-rescopesurveys}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_REDIS_REQUIRED: 'true'
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET to a strong random value}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random value (32+ characters)}
      COOKIE_SECURE: 'true'
      AUTH_ALLOW_BEARER: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.rescopesurveys.com,https://rescopesurveys.com,https://www.rescopesurveys.com,https://surveys.rescopesurveys.com}
      # Real mail is mandatory in production: invites, email confirmation, password reset.
      EMAIL_TRANSPORT: smtp
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL (e.g. smtps://user:pass@smtp.example.com:465)}
      EMAIL_FROM: ${EMAIL_FROM:-Rescope Surveys <no-reply@rescopesurveys.com>}
      APP_URL: ${APP_URL:-https://app.rescopesurveys.com}
      PANEL_OAUTH_CLIENT_ID: ${PANEL_OAUTH_CLIENT_ID:-rescope-panel}
      PANEL_OAUTH_CLIENT_SECRET: ${PANEL_OAUTH_CLIENT_SECRET:?Set PANEL_OAUTH_CLIENT_SECRET}
      PANEL_OAUTH_REDIRECT_URI: ${PANEL_OAUTH_REDIRECT_URI:-https://panel.rescopesurveys.com/api/auth/builder/callback}
      SEED_DEFAULT_ACCOUNTS: 'false'
      RUN_PLATFORM_LIST_MIGRATION: 'false'
      REQUIRE_STRONG_JWT: 'true'
      RATE_LIMIT_RELAXED: 'false'
    mem_limit: ${API_MEMORY:-768m}

  web:
    ports: !override
      - '127.0.0.1:${WEB_HOST_PORT:-8080}:80'
    mem_limit: ${WEB_MEMORY:-256m}
